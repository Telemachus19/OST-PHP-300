services:
  web:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
    container_name: xampp-web
    environment:
      JWT_SECRET: super-secret-change-this
      JWT_TTL_SECONDS: 3600
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
      - ./docker/php-apache/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - db

  db:
    image: mariadb:11.4
    container_name: xampp-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: xampp-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
